name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v1.2.3"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      # Home Assistant reads the running version from the manifest, so a tag
      # that disagrees with it ships an integration that reports the wrong one.
      - name: Verify the tag matches both versions
        run: |
          project="v$(uv version --short)"
          manifest="v$(python3 -c 'import json; print(json.load(open("custom_components/fglair_local/manifest.json"))["version"])')"
          if [ "$TAG" != "$project" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $project"
            exit 1
          fi
          if [ "$TAG" != "$manifest" ]; then
            echo "::error::tag $TAG does not match manifest.json version $manifest"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: uv run mypy custom_components/fglair_local

      - name: Test
        run: uv run pytest

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  release:
    name: Release
    needs: [verify, hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      # hacs.json sets zip_release to false, so HACS installs from the tagged
      # source and the release carries no build artifact.
      - name: Create the GitHub release if it is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, skipping"
            exit 0
          fi
          ./script/release_notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --verify-tag
