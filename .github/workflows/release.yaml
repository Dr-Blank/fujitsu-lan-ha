name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v1.2.3"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: Dr-Blank/ha-integration-ci/.github/workflows/release.yaml@15390ee063de87b9bbf0d5cd607adf325866757e # v1.0.0
    with:
      tag: ${{ inputs.tag || github.ref_name }}
